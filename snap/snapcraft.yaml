name: yt-grabber-tui
version: "1.1-rc"
summary: yt-grabber-tui
description: yt-grabber-tui
base: core24
confinement: strict
grade: stable
platforms:
  amd64:
    build-on: amd64
    build-for: amd64
apps:
  yt-grabber-tui:
    command: bin/yt-grabber-tui
parts:
  ftxui:
    plugin: cmake
    source: https://github.com/ArthurSonzogni/FTXUI.git
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
  boost:
    plugin: nil
    source: https://github.com/boostorg/boost.git
    source-depth: 1
    build-packages:
      - g++
      - make
      - python3
    override-build: |
      ./bootstrap.sh
      ./b2 install --prefix="$SNAPCRAFT_PART_INSTALL/usr"
  yt-grabber-tui:
    plugin: make
    source: .
    build-packages:
      - g++
      - make
    override-build: |
      export CPATH="$SNAPCRAFT_STAGE/usr/include:$SNAPCRAFT_PART_INSTALL/usr/include"
      export LIBRARY_PATH="$SNAPCRAFT_STAGE/usr/lib:$SNAPCRAFT_STAGE/usr/lib/x86_64-linux-gnu:$SNAPCRAFT_PART_INSTALL/usr/lib"
      export PKG_CONFIG_PATH="$SNAPCRAFT_STAGE/usr/lib/pkgconfig:$SNAPCRAFT_PART_INSTALL/usr/lib/pkgconfig"
      make -j$(nproc)
      install -Dm755 yt-grabber-tui "$SNAPCRAFT_PART_INSTALL/bin/yt-grabber-tui"
