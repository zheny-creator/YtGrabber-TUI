name: yt-grabber-tui
version: '1.1-rc'
summary: TUI утилита для скачивания видео и аудио с YouTube
description: |
  Yt-grabber-tui — лёгкая текстовая (TUI) утилита на основе FTXUI для скачивания
  видео и аудио с YouTube и других поддерживаемых сайтов.
base: core24
confinement: classic
grade: stable
platforms:
  amd64:

apps:
  yt-grabber-tui:
    command: bin/yt-grabber-tui
    plugs: [network, network-bind, removable-media]

parts:
  boost:
    plugin: nil
    source: https://sourceforge.net/projects/boost/files/boost/1.89.0/boost_1_89_0.tar.gz/download
    source-type: tar
    build-packages:
      - build-essential
      - wget
    override-build: |
      ./bootstrap.sh --prefix=$CRAFT_PART_INSTALL/usr
      ./b2 install -j$(nproc) --prefix=$CRAFT_PART_INSTALL/usr --with-system --with-filesystem --with-program_options --with-regex --with-thread

  ftxui:
    plugin: cmake
    source: https://github.com/ArthurSonzogni/FTXUI.git
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=$CRAFT_PART_INSTALL/usr
      - -DBUILD_SHARED_LIBS=OFF
      - -DFT_ENABLE_TEST=OFF
    build-packages:
      - build-essential
      - cmake

  yt-grabber-tui:
    plugin: make
    source: .
    after: [boost, ftxui]
    build-packages:
      - pkg-config
      - libfmt-dev
      - libspdlog-dev
      - build-essential
    stage-packages:
      - libspdlog1.12
    override-build: |
      export CPATH="/root/parts/boost/install/usr/include:/root/parts/ftxui/install/usr/include:$CRAFT_STAGE/usr/include:${CPATH:-}"
      export LIBRARY_PATH="/root/parts/boost/install/usr/lib:/root/parts/ftxui/install/usr/lib:/root/parts/boost/install/usr/lib/x86_64-linux-gnu:/root/parts/ftxui/install/usr/lib/x86_64-linux-gnu:$CRAFT_STAGE/usr/lib:$CRAFT_STAGE/usr/lib/x86_64-linux-gnu:${LIBRARY_PATH:-}"
      export PKG_CONFIG_PATH="/root/parts/boost/install/usr/lib/pkgconfig:/root/parts/ftxui/install/usr/lib/pkgconfig:/root/parts/boost/install/usr/lib/x86_64-linux-gnu/pkgconfig:/root/parts/ftxui/install/usr/lib/x86_64-linux-gnu/pkgconfig:$CRAFT_STAGE/usr/lib/pkgconfig:$CRAFT_STAGE/usr/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
      make -j$(nproc)
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp yt-grabber-tui $CRAFT_PART_INSTALL/bin/