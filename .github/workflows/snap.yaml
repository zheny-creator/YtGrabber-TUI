name: Build, Pack and Upload Snap
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git pkg-config \
            libfmt-dev libspdlog-dev wget

      - name: Install snapcraft (classic)
        run: sudo snap install snapcraft --classic

      - name: Fix LXD group (required by snapcraft on GitHub Actions)
        run: |
          sudo usermod -aG lxd $USER
          newgrp lxd

      - name: Install Boost 1.89
        run: |
          cd /tmp
          wget -O boost_1_89_0.tar.gz "https://sourceforge.net/projects/boost/files/boost/1.89.0/boost_1_89_0.tar.gz/download"
          tar xzf boost_1_89_0.tar.gz
          cd boost_1_89_0
          ./bootstrap.sh --prefix=/usr/local
          sudo ./b2 install -j$(nproc) --with-system --with-filesystem --with-process --with-property_tree --with-thread --with-program_options --with-regex
          sudo ldconfig

      - name: Install FTXUI
        run: |
          git clone https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Build project
        run: make -j$(nproc)

      - name: Pack snap
        run: sg lxd -c "snapcraft pack"

      - name: Upload .snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui.snap
          path: yt-grabber-tui_*.snap