name: Build Windows Release

on:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-spdlog
            git
            wget

      - name: Install Boost 1.89
        run: |
          cd /tmp
          wget https://github.com/boostorg/boost/releases/download/boost-1.89.0/boost-1.89.0.tar.gz
          tar xzf boost-1.89.0.tar.gz
          cd boost-1.89.0
          ./bootstrap.sh --prefix=/ucrt64 --with-toolset=mingw
          ./b2 toolset=gcc install -j$(nproc) \
            --with-system \
            --with-filesystem \
            --with-process \
            --with-property_tree \
            link=static \
            runtime-link=shared \
            variant=release
          cd -

      - name: Install FTXUI
        run: |
          git clone https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          cmake -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          cd ..

      - name: Build project
        run: |
          make

      - name: Create distribution
        run: |
          mkdir -p dist
          cp yt-grabber-tui.exe dist/
          # Копируем runtime DLL из MSYS2
          cp /ucrt64/bin/libfmt-11.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libspdlog-1.15.dll dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../yt-grabber-tui-windows-x86_64-${{ github.ref_name }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-windows-x86_64-${{ github.ref_name }}
          path: yt-grabber-tui-windows-x86_64-${{ github.ref_name }}.zip