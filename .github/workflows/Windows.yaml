name: Build Windows Release

on:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-boost #
            git
            zip
            make

      - name: Install FTXUI
        run: |
          git clone https://github.com/ArthurSonzogni/FTXUI.git
          cd FTXUI
          cmake -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/ucrt64 \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          cd ..

      - name: Build project
        run: make windows

      - name: Create distribution (Include Boost DLLs)
        run: |
          mkdir -p dist
          cp yt-grabber-tui.exe dist/
          # Копируем runtime DLL из MSYS2
          # Используем маски для libfmt, libspdlog и системных DLL
          cp /ucrt64/bin/libfmt*.dll dist/
          cp /ucrt64/bin/libspdlog*.dll dist/
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/
          cp /ucrt64/bin/libstdc++-6.dll dist/
          cp /ucrt64/bin/libwinpthread-1.dll dist/
          cp /ucrt64/bin/libboost_process*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libboost_filesystem*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libboost_thread*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libboost_program_options*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libboost_regex*.dll dist/ 2>/dev/null || true

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../yt-grabber-tui-windows-x86_64-${{ github.ref_name }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-windows-x86_64-${{ github.ref_name }}
          path: yt-grabber-tui-windows-x86_64-${{ github.ref_name }}.zip