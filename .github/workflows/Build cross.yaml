name: Build Release Cross

on:
  push:
    tags:
      - '*'

jobs:
  build-musl-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Alpine (musl x86_64)
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace alpine:latest /bin/sh -c "
            apk add --no-cache build-base boost-dev fmt-dev spdlog-dev
            make
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-musl-x86_64-${{ github.ref_name }}
          path: yt-grabber-tui

  build-arm64-glibc:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Ubuntu ARM64 (glibc)
        run: |
          docker run --rm --platform linux/arm64 -v $(pwd):/workspace -w /workspace ubuntu:22.04 /bin/bash -c "
            apt-get update
            apt-get install -y build-essential libboost-all-dev libfmt-dev libspdlog-dev
            make
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-arm64-glibc-${{ github.ref_name }}
          path: yt-grabber-tui