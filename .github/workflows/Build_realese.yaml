name: Build Release Cross

on:
  push:
    tags:
      - '*'

jobs:
  build-musl-x86_64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Alpine (musl x86_64)
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace alpine:latest /bin/sh -c "
            apk add --no-cache build-base git cmake wget
            cd /tmp
            wget -O boost_1_89_0.tar.gz "https://sourceforge.net/projects/boost/files/boost/1.89.0/boost_1_89_0.tar.gz/download"
            tar xzf boost_1_89_0.tar.gz
            cd boost_1_89_0
            ./bootstrap.sh --prefix=/usr
            ./b2 install -j\$(nproc) --with-system --with-filesystem --with-process --with-property_tree
            cd /workspace
            # Установка остальных зависимостей
            apk add --no-cache fmt-dev spdlog-dev
            git clone https://github.com/ArthurSonzogni/FTXUI.git
            cd FTXUI
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_SHARED_LIBS=OFF
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..
            make alpine
            mkdir libs
            cp /usr/lib/libboost_process.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_filesystem.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_system.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_property_tree.so* libs/ 2>/dev/null || true &&
            find /usr/lib /usr/lib/x86_64-linux-gnu -name 'libfmt.so.*' -exec cp {} libs/ \;
            tar -cvf yt-grabber-tui.tar yt-grabber-tui libs/*
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-musl-x86_64-${{ github.ref_name }}
          path: yt-grabber-tui.tar

  build-musl-arm64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine (musl arm64)
        run: |
          docker run --rm --platform linux/arm64 -v $(pwd):/workspace -w /workspace alpine:latest /bin/sh -c "
            apk add --no-cache build-base git cmake wget
            cd /tmp
            wget -O boost_1_89_0.tar.gz "https://sourceforge.net/projects/boost/files/boost/1.89.0/boost_1_89_0.tar.gz/download"
            tar xzf boost_1_89_0.tar.gz
            cd boost_1_89_0
            ./bootstrap.sh --prefix=/usr
            ./b2 install -j\$(nproc) --with-system --with-filesystem --with-process --with-property_tree
            cd /workspace
            # Установка остальных зависимостей
            apk add --no-cache fmt-dev spdlog-dev
            git clone https://github.com/ArthurSonzogni/FTXUI.git
            cd FTXUI
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_SHARED_LIBS=OFF
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..
            make alpine
            mkdir libs
            cp /usr/lib/libboost_process.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_filesystem.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_system.so* libs/ 2>/dev/null || true &&
            cp /usr/lib/libboost_property_tree.so* libs/ 2>/dev/null || true &&
            find /usr/lib /usr/lib/x86_64-linux-gnu -name 'libfmt.so.*' -exec cp {} libs/ \;
            tar -cvf yt-grabber-tui.tar yt-grabber-tui libs/*
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-musl-arm64-${{ github.ref_name }}
          path: yt-grabber-tui.tar

  build-arm64-glibc:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Ubuntu ARM64 (glibc)
        run: |
          docker run --rm --platform linux/arm64 -v $(pwd):/workspace -w /workspace ubuntu:22.04 /bin/bash -c "
            apt-get update
            apt-get install -y build-essential git cmake wget pkg-config libfmt-dev libspdlog-dev
            cd /tmp
            wget -O boost_1_89_0.tar.gz "https://sourceforge.net/projects/boost/files/boost/1.89.0/boost_1_89_0.tar.gz/download"
            tar xzf boost_1_89_0.tar.gz
            cd boost_1_89_0
            ./bootstrap.sh --prefix=/usr/local
            ./b2 install -j\$(nproc) --with-system --with-filesystem --with-process --with-property_tree
            cd /workspace
            ldconfig
            # Установка FTXUI
            git clone https://github.com/ArthurSonzogni/FTXUI.git
            cd FTXUI
            cmake -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_SHARED_LIBS=OFF
            cmake --build build -j\$(nproc)
            cmake --install build
            cd ..
            make
          "

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yt-grabber-tui-arm64-glibc-${{ github.ref_name }}
          path: yt-grabber-tui